<!-- GPante Support Chat: paste once in the global WoodMart footer. Requires the server-side chat endpoint. -->
<style>
#gpante-support {
	--gpante-primary: #365e28;
	--gpante-on-primary: #ffffff;
	--gpante-surface: #ffffff;
	--gpante-text: #263023;
	--gpante-messages: #f7f9f4;
	--gpante-user: #e9f0e2;
	--gpante-assistant: #ffffff;
	--gpante-accent: #fbbc34;
	--gpante-border: #dfe5da;
	--gpante-border: color-mix(in srgb, var(--gpante-text) 14%, var(--gpante-surface));
	position: fixed;
	inset-inline-end: max(20px, env(safe-area-inset-left));
	bottom: max(20px, env(safe-area-inset-bottom));
	z-index: 99990;
	color: var(--gpante-text);
	font-family: var(--wd-text-font, "dana", Tahoma, sans-serif);
	font-size: 14px;
	line-height: 1.8;
	text-align: right;
	direction: rtl;
}
#gpante-support *, #gpante-support *::before, #gpante-support *::after { box-sizing: border-box; }
#gpante-support [hidden] { display: none !important; }
#gpante-support button, #gpante-support textarea { font: inherit; letter-spacing: normal; text-transform: none; }
#gpante-support button {
	min-height: 44px;
	padding: 8px 14px;
	border: 1px solid transparent;
	border-radius: 10px;
	background: var(--gpante-primary);
	color: var(--gpante-on-primary);
	cursor: pointer;
	line-height: 1.6;
	box-shadow: none;
}
#gpante-support button:disabled { opacity: .55; cursor: default; }
#gpante-support button:focus-visible, #gpante-support textarea:focus-visible,
#gpante-support a:focus-visible, #gpante-support [tabindex]:focus-visible {
	outline: 3px solid var(--gpante-text);
	outline-offset: 3px;
}
#gpante-support .gpante-chat-launcher {
	display: flex;
	align-items: center;
	gap: 10px;
	margin-inline-start: auto;
	min-height: 52px;
	padding: 12px 20px;
	border-radius: 28px;
	box-shadow: 0 5px 22px #193e242b;
	font-weight: 700;
}
#gpante-support .gpante-chat-launcher svg { flex: 0 0 auto; overflow: visible; }
#gpante-support .gpante-chat-panel {
	display: flex;
	flex-direction: column;
	width: min(390px, calc(100vw - 32px));
	height: min(650px, calc(100vh - 110px));
	height: min(650px, calc(100dvh - 110px));
	margin-bottom: 12px;
	overflow-y: auto;
	border: 1px solid var(--gpante-border);
	border-radius: 20px;
	background: var(--gpante-surface);
	box-shadow: 0 12px 40px #0000001a, 0 2px 8px #0000000a;
}
#gpante-support .gpante-chat-header {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
	flex-shrink: 0;
	padding: 14px 16px;
	border-top: 4px solid var(--gpante-accent);
	background: var(--gpante-primary);
	color: var(--gpante-on-primary);
}
#gpante-support .gpante-chat-heading { flex: 1; min-width: 0; }
#gpante-support .gpante-chat-title-row { display: flex; align-items: center; gap: 8px; }
#gpante-support [data-title] { display: block; flex: 1; min-width: 0; font-size: 17px; line-height: 1.8; color: inherit; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#gpante-support [data-subtitle] { display: block; font-size: 12px; line-height: 1.8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#gpante-support .gpante-chat-header button { flex: 0 0 44px; min-width: 44px; padding: 0; font-size: 27px; background: transparent; }
#gpante-support .gpante-chat-toolbar { padding: 4px 12px; }
#gpante-support .gpante-chat-toolbar button { background: transparent; color: var(--gpante-text); font-size: 11px; padding: 6px 10px; border-radius: 20px; }
#gpante-support .gpante-chat-confirm { padding: 10px 16px; background: var(--gpante-surface); font-size: 12px; }
#gpante-support .gpante-chat-confirm p { margin: 0 0 8px; color: inherit; }
#gpante-support .gpante-chat-confirm button { padding: 6px 12px; margin-inline-end: 6px; }
#gpante-support [data-cancel] { background: var(--gpante-surface); color: var(--gpante-text); border-color: var(--gpante-border); }
#gpante-support .gpante-chat-messages {
	min-height: 70px;
	flex: 1 1 auto;
	padding: 14px;
	overflow-y: auto;
	overscroll-behavior: contain;
	background: var(--gpante-messages);
	scrollbar-gutter: stable;
	scrollbar-width: thin;
}
#gpante-support .gpante-chat-message {
  width: fit-content;
  max-width: 88%;
  padding: 8px 11px;
  margin: 0 0 8px;
  border: 0;
  background: var(--gpante-assistant);
  box-shadow: 0 1px 3px #0000000d;
}
#gpante-support .gpante-chat-message > small { display: block; margin-bottom: 2px; color: inherit; font-size: 10px; line-height: 1.5; }
#gpante-support .gpante-chat-message > div { white-space: pre-wrap; overflow-wrap: anywhere; unicode-bidi: plaintext; }
#gpante-support .gpante-chat-message--user { margin-left: auto; margin-right: 0; background: var(--gpante-user); border-radius: 16px 16px 4px 16px; }
#gpante-support .gpante-chat-message--assistant { margin-right: auto; margin-left: 0; border-radius: 16px 16px 16px 4px; }
#gpante-support .gpante-chat-message--welcome { width: 100%; max-width: none; margin-left: 0; margin-right: 0; padding: 14px; border-radius: 16px; }
#gpante-support .gpante-chat-message--rich { width: 100%; max-width: 100%; }
#gpante-support .gpante-chat-message > .gpante-chat-reply { white-space: normal; min-width: 0; line-height: 1.7; }
#gpante-support .gpante-chat-reply p { margin: 0 0 6px; color: inherit; white-space: pre-line; }
#gpante-support .gpante-chat-reply > :last-child { margin-bottom: 0; }
#gpante-support .gpante-chat-reply strong { color: inherit; font-weight: 700; }
#gpante-support .gpante-chat-message a.gpante-chat-link {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  width: 100%;
  max-width: 100%;
  margin-block: 4px;
  padding: 6px 10px;
  border: 1px solid var(--gpante-primary);
  border-radius: 12px;
  background: var(--gpante-primary);
  color: var(--gpante-on-primary);
  text-decoration: none;
  text-align: center;
  font-weight: 400;
  line-height: 1.6;
  white-space: normal;
  overflow-wrap: anywhere;
}
#gpante-support .gpante-chat-message a.gpante-chat-link:hover { text-decoration: none; box-shadow: 0 2px 8px #00000018; }
#gpante-support .gpante-chat-message--assistant { width: 100%; max-width: 100%; padding: 0; background: transparent; box-shadow: none; }
#gpante-support .gpante-chat-message--assistant > small { width: fit-content; margin-right: auto; margin-left: 0; padding-inline: 4px; }
#gpante-support .gpante-chat-segment { width: fit-content; max-width: 88%; margin: 0 auto 10px 0; padding: 10px 12px; border: 1px solid var(--gpante-border); border-radius: 16px 16px 16px 4px; background: var(--gpante-assistant); box-shadow: 0 1px 3px #0000000a; }
#gpante-support .gpante-chat-segment:last-child { margin-bottom: 0; }
#gpante-support .gpante-chat-segment--card { width: 100%; max-width: 100%; }
#gpante-support .gpante-chat-facts { margin: 8px 0; padding: 0 16px 0 0; list-style: disc; font-size: 13px; line-height: 1.8; }
#gpante-support .gpante-chat-facts li { margin: 2px 0; padding: 0; color: inherit; overflow-wrap: anywhere; }
#gpante-support .gpante-chat-facts strong { font-weight: 600; }
#gpante-support .gpante-chat-card-heading { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
#gpante-support .gpante-chat-thumbnail { display: block; flex: 0 0 48px; width: 48px; height: 48px; margin: 0; border: 1px solid var(--gpante-border); border-radius: 10px; object-fit: contain; background: #fff; }
#gpante-support .gpante-chat-card-copy { flex: 1; min-width: 0; }
#gpante-support .gpante-chat-card-title { display: block; margin: 0 0 3px; font-size: 14px; line-height: 1.7; overflow-wrap: anywhere; }
#gpante-support .gpante-chat-card-copy p { margin: 0; font-size: 13px; line-height: 1.7; }
#gpante-support .gpante-chat-message--welcome { padding: 14px; background: var(--gpante-assistant); box-shadow: 0 1px 3px #0000000d; }
#gpante-support .gpante-chat-message--welcome .gpante-chat-segment { max-width: 100%; width: 100%; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
#gpante-support .gpante-chat-status { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 110px; gap: 5px; padding: 2px 6px; border-radius: 20px; background: #fff; color: #263023; font-size: 12px; font-weight: 400; line-height: 1.6; white-space: nowrap; }
#gpante-support .gpante-chat-status-icon { position: relative; display: block; flex: 0 0 14px; width: 14px; height: 14px; border: 2px solid #946600; border-radius: 50%; background: #f9d873; }
#gpante-support .gpante-chat-status[data-state="connecting"] .gpante-chat-status-icon { border-inline-end-color: transparent; animation: gpante-chat-status-spin 1s linear infinite; }
#gpante-support .gpante-chat-status[data-state="ready"] .gpante-chat-status-icon { background: #176f42; border-color: #176f42; }
#gpante-support .gpante-chat-status[data-state="ready"] .gpante-chat-status-icon::after { content: ''; position: absolute; width: 4px; height: 7px; top: 0; left: 3px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
#gpante-support .gpante-chat-status[data-state="offline"] .gpante-chat-status-icon { background: #c43030; border-color: #c43030; }
#gpante-support .gpante-chat-notice { margin-block: 8px; padding: 10px 12px; border: 1px solid var(--gpante-border); border-radius: 12px; color: var(--gpante-text); background: var(--gpante-surface); font-size: 12px; line-height: 1.8; overflow-wrap: anywhere; }
#gpante-support .gpante-chat-notice p { margin: 0; color: inherit; font-size: inherit; }
#gpante-support .gpante-chat-notice button { margin-block-start: 8px; font-size: 12px; font-weight: 400; }
#gpante-support .gpante-chat-activity { display: flex; align-items: center; gap: 8px; padding: 8px 2px; color: var(--gpante-text); font-size: 12px; line-height: 1.8; }
#gpante-support .gpante-chat-dots { display: inline-flex; gap: 3px; flex: 0 0 auto; }
#gpante-support .gpante-chat-dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: gpante-chat-pulse 1.2s ease-in-out infinite; }
#gpante-support .gpante-chat-dots i:nth-child(2) { animation-delay: .15s; }
#gpante-support .gpante-chat-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes gpante-chat-pulse { 50% { opacity: .25; } }
@keyframes gpante-chat-status-spin { to { transform: rotate(360deg); } }
#gpante-support .gpante-chat-form { flex-shrink: 0; margin: 0; padding: 10px 12px 12px; border-top: 1px solid var(--gpante-border); background: var(--gpante-surface); }
#gpante-support textarea {
	display: block;
	width: 100%;
	min-height: 56px;
	max-height: 110px;
	padding: 8px 10px;
	border: 1px solid var(--gpante-border);
	border-radius: 8px;
	background: var(--gpante-surface);
	color: var(--gpante-text);
	box-shadow: none;
	resize: vertical;
	direction: rtl;
	text-align: right;
	font-size: 14px;
	line-height: 1.7;
}
#gpante-support textarea::placeholder { color: var(--gpante-text); opacity: 1; }
@media (max-width: 480px) {
	#gpante-support { inset-inline-end: max(8px, env(safe-area-inset-left)); bottom: max(8px, env(safe-area-inset-bottom)); }
	#gpante-support .gpante-chat-panel { width: calc(100vw - 16px); height: min(650px, calc(100vh - 88px)); height: min(650px, calc(100dvh - 88px)); margin-bottom: 8px; border-radius: 14px; }
	#gpante-support textarea { font-size: 16px; }
}
@media (max-height: 520px) {
	#gpante-support .gpante-chat-panel { height: calc(100vh - 80px); height: calc(100dvh - 80px); }
	#gpante-support .gpante-chat-header { padding-block: 5px; }
	#gpante-support textarea { min-height: 40px; max-height: 60px; }
}

/* Short screens scroll the whole panel so the composer and reset controls stay reachable. */
@media (max-height: 520px) {
  #gpante-support { bottom: max(8px, env(safe-area-inset-bottom)); }
  #gpante-support .gpante-chat-launcher[aria-expanded="true"] { display: none; }
  #gpante-support .gpante-chat-panel {
    height: calc(100vh - 24px);
    height: calc(100dvh - 24px);
    margin-bottom: 0;
    overflow-y: auto;
  }
  #gpante-support .gpante-chat-panel > * { flex-shrink: 0; }
  #gpante-support .gpante-chat-messages { flex: 1 0 80px; }
}

#gpante-support .gpante-chat-header button:focus-visible { outline-color: var(--gpante-on-primary); }
#gpante-support .gpante-chat-launcher span { overflow-wrap: anywhere; }

#gpante-support .gpante-chat-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
#gpante-support .gpante-chat-composer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border: 1px solid var(--gpante-border);
  border-radius: 18px;
  background: var(--gpante-surface);
  transition: box-shadow .15s ease;
}
#gpante-support .gpante-chat-composer:focus-within {
  border-color: var(--gpante-text);
  box-shadow: 0 2px 14px #00000014;
  box-shadow: 0 2px 14px color-mix(in srgb, var(--gpante-text) 20%, transparent);
}
#gpante-support .gpante-chat-composer textarea,
#gpante-support .gpante-chat-composer textarea:focus,
#gpante-support .gpante-chat-composer textarea:focus-visible {
  flex: 1 1 auto;
  min-width: 0;
  border: 0;
  outline: none;
  box-shadow: none;
}
#gpante-support .gpante-chat-composer [data-send] { display: grid; place-items: center; flex: 0 0 44px; width: 44px; height: 44px; padding: 0; border-radius: 50%; }
#gpante-support .gpante-chat-composer [data-send] svg { display: block; margin: auto; }
#gpante-support .gpante-chat-count { display: block; padding-top: 4px; color: var(--gpante-text); font-size: 10px; }
#gpante-support .gpante-chat-shortcuts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-block: 4px 4px; }
#gpante-support .gpante-chat-shortcuts a {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 11px 12px;
  border: 1px solid var(--gpante-border);
  border-radius: 14px;
  background: var(--gpante-surface);
  color: var(--gpante-text);
  font-size: 12px;
  font-weight: 400;
  line-height: 1.7;
  text-align: center;
  text-decoration: none;
  overflow-wrap: anywhere;
}
#gpante-support .gpante-chat-shortcuts a:last-child:nth-child(odd) { grid-column: 1 / -1; }
#gpante-support .gpante-chat-shortcuts a:hover { text-decoration: underline; border-color: var(--gpante-text); }
@media (prefers-reduced-motion: reduce) {
  #gpante-support .gpante-chat-composer { transition: none; }
  #gpante-support .gpante-chat-status-icon, #gpante-support .gpante-chat-dots i { animation: none !important; }
}
#gpante-support .gpante-chat-feedback { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
#gpante-support .gpante-chat-feedback button,
#gpante-support .gpante-chat-older { background: var(--gpante-surface); color: var(--gpante-text); border-color: var(--gpante-border); font-size: 12px; }
#gpante-support .gpante-chat-feedback button[aria-pressed="true"] { border-color: var(--gpante-text); text-decoration: underline; }
#gpante-support .gpante-chat-older { display: block; margin: 0 auto 12px; }
</style>

																																											</nav>

		<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-3 2v-10A8.5 8.5 0 0 1 9.5 3H12a8 8 0 0 1 8 8.5Z"/><path d="M6 9h9M6 13h6"/></svg>

<script>
(function () {
  'use strict';

  function safeLink(address) {
    if (address === 'tel:+989179509010') return true;
    if (address === 'https://t.me/gpante_designer' || typeof address === 'string' && !/\s/.test(address) && /^https:\/\/gpante\.com\/faq-ai\/#faq-[a-z0-9][a-z0-9-]{0,79}$/.test(address)) return true;
    if (['https://gpante.com/my-account/', 'https://gpante.com/cart/', 'https://gpante.com/checkout/'].includes(address)) return true;
    if (typeof address !== 'string' || !/^https:\/\/gpante\.com\/[^\s?#\\]*$/u.test(address)) return false;
    try {
      // Validate before URL normalization, which would hide traversal segments.
      const path = decodeURIComponent(address.slice('https://gpante.com'.length));
      return !/[\\\x00-\x20\x7f%?#]/u.test(path) && !path.includes('//')
        && !/(?:^|\/)\.{1,2}(?:\/|$)/u.test(path)
        && !/^\/(?:wp-json|wp-content|wp-includes|wp-admin|wp-login\.php|wp-signup\.php|xmlrpc\.php|download|downloads|wc-api|my-account|checkout|cart)(?:\/|$)/iu.test(path);
    } catch (_) {
      return false;
    }
  }

  function shortcutUrl(address, base = 'https://gpante.com/') {
    if (typeof address !== 'string' || address.length > 2048
      || /[\\\x00-\x20\x7f]|%(?:0[0-9a-f]|1[0-9a-f]|7f|5c)/i.test(address)
      || !/^(?:https:\/\/|\/(?!\/))/.test(address)) return null;
    try {
      const url = new URL(address, base);
      return url.protocol === 'https:' && !url.username && !url.password ? url.href : null;
    } catch (_) { return null; }
  }

  function appendText(container, text) {
    let end = 0;
    for (const match of text.matchAll(/\*\*([^*\n]{1,300})\*\*/gu)) {
      container.append(document.createTextNode(text.slice(end, match.index)));
      const strong = document.createElement('strong');
      strong.textContent = match[1];
      container.append(strong);
      end = match.index + match[0].length;
    }
    container.append(document.createTextNode(text.slice(end)));
  }

  function appendInline(container, content) {
    const pattern = /\[([^\]\n]{1,300})\]\(([^)]*)\)|(?:https:\/\/|tel:)[^\s<>()\[\]]+/gu;
    let end = 0;
    let previousLink = false;
    for (const match of content.matchAll(pattern)) {
      const address = match[2] || match[0].replace(/[.,،؛]+$/u, '');
      const allowed = safeLink(address);
      const between = content.slice(end, match.index);
      if (!previousLink || !allowed || between.trim()) appendText(container, between);
      if (allowed) {
        const link = document.createElement('a');
        link.href = address;
        link.className = 'gpante-chat-link';
        if (address === 'tel:+989179509010') {
          link.textContent = '09179509010';
          link.title = 'تماس مستقیم با طراح';
        } else {
          link.textContent = match[1]?.replace(/\*\*/g, '') || (address.startsWith('https://gpante.com/product/') ? 'مشاهدهٔ محصول' : 'مشاهدهٔ صفحه');
          link.title = 'بازکردن در برگهٔ تازه';
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
        }
        container.append(link);
        if (!match[2]) container.append(document.createTextNode(match[0].slice(address.length)));
      } else {
        container.append(document.createTextNode(match[0]));
      }
      previousLink = allowed;
      end = match.index + match[0].length;
    }
    appendText(container, content.slice(end));
  }

  function tableCells(line) {
    const value = line.trim();
    if (!value.startsWith('|') || !value.endsWith('|')) return null;
    const cells = [];
    let cell = '';
    for (let i = 1; i < value.length - 1; i++) {
      if (value[i] === '\\' && value[i + 1] === '|') { cell += '|'; i++; }
      else if (value[i] === '|') { cells.push(cell.trim()); cell = ''; }
      else cell += value[i];
    }
    cells.push(cell.trim());
    return cells.length >= 2 && cells.length <= 4 ? cells : null;
  }

  function readTable(lines, start) {
    const header = tableCells(lines[start]);
    const separator = tableCells(lines[start + 1] || '');
    if (!header || !separator || separator.length !== header.length || header.some(cell => !cell)
      || separator.some(cell => !/^:?-{3,}:?$/.test(cell))) return null;
    const rows = [];
    let next = start + 2;
    while (next < lines.length && lines[next].trim().startsWith('|')) {
      const cells = tableCells(lines[next]);
      if (!cells || cells.length !== header.length || rows.length >= 20) return null;
      rows.push(cells);
      next++;
    }
    return rows.length ? { header, rows, next } : null;
  }

  function safeThumbnail(address) {
    if (typeof address !== 'string' || address.length > 2048
      || !/^https:\/\/gpante\.com\/wp-content\/uploads\/[^\s?#\\]+\.(?:jpe?g|png|webp|avif|gif)$/iu.test(address)) return false;
    try {
      const path = decodeURIComponent(address.slice('https://gpante.com'.length));
      return !/[\\\x00-\x20\x7f%?#]/u.test(path) && !path.includes('//') && !/(?:^|\/)\.{1,2}(?:\/|$)/u.test(path);
    } catch (_) { return false; }
  }

  function navigationItems(text) {
    const pattern = /\[[^\]\n]{1,300}\]\(([^)]*)\)|((?:https:\/\/|tel:)[^\s<>()\[\]]+)/gu;
    const items = [...text.matchAll(pattern)];
    return items.length && !text.replace(pattern, '').trim() && items.every(item => safeLink(item[1] || item[2]))
      ? items.map(item => item[0]) : null;
  }

  function replySections(content) {
    const lines = content.replace(/\r\n?/g, '\n').split('\n');
    const sections = [];
    let blocks = [], buffer = [], grouped = false;
    const finishSection = () => { if (blocks.length) sections.push(blocks); blocks = []; grouped = false; };
    const flush = () => {
      const text = buffer.join('\n').trim();
      buffer = [];
      if (!text) return;
      if (!grouped) finishSection();
      const navigation = navigationItems(text);
      if (navigation) {
        if (navigation.length > 1) finishSection();
        for (const line of navigation) { blocks.push({type:'text',text:line}); finishSection(); }
      } else blocks.push({type:'text',text});
    };
    for (let i = 0; i < lines.length;) {
      const heading = lines[i].trim().match(/^(?:#{1,3}\s+(.+)|(?:[0-9۰-۹]+[.)]\s*)?\*\*([^*\n]{1,300})\*\*)$/u);
      const table = readTable(lines, i);
      if (heading) {
        flush();finishSection();
        blocks.push({type:'heading',text:heading[1] || heading[2]});grouped = true;i++;
      } else if (table) {
        flush();
        if (!grouped) finishSection();
        blocks.push({type:'facts',data:table});grouped = true;i = table.next;
      } else {
        if (lines[i].trim()) buffer.push(lines[i]); else flush();
        i++;
      }
    }
    flush();finishSection();
    return sections;
  }

  function appendFacts(container, data) {
    const list = document.createElement('ul');
    list.className = 'gpante-chat-facts';
    for (const cells of data.rows) {
      const item = document.createElement('li');
      const label = document.createElement('strong');
      label.textContent = (cells.length > 2 ? data.header[0] + ': ' : '') + cells[0].replace(/\*\*/g, '') + ': ';
      item.append(label);
      appendInline(item, cells.length === 2 ? cells[1] : cells.slice(1).map((value, i) => data.header[i + 1] + ': ' + value).join(' / '));
      list.append(item);
    }
    container.append(list);
  }

  function appendParagraph(container, text) {
    let buffer = [], list = null;
    const flush = () => {
      if (!buffer.length) return;
      const paragraph = document.createElement('p');
      appendInline(paragraph, buffer.join('\n'));container.append(paragraph);buffer = [];
    };
    for (const line of text.split('\n')) {
      const bullet = line.match(/^\s*(?:[-*•]|[0-9۰-۹]+[.)])\s+(.+)$/u);
      if (bullet) {
        flush();
        if (!list) { list = document.createElement('ul');list.className = 'gpante-chat-facts';container.append(list); }
        const item = document.createElement('li');appendInline(item, bullet[1]);list.append(item);
      } else { list = null;buffer.push(line); }
    }
    flush();
  }

  function appendContent(container, content, products = []) {
    const previews = new Map();
    for (const product of Array.isArray(products) ? products.slice(0,30) : []) {
      if (safeLink(product?.url) && product.url.startsWith('https://gpante.com/product/')
        && safeThumbnail(product.thumbnail) && typeof product.title === 'string' && product.title.trim() && product.title.length <= 300) previews.set(product.url, product);
    }
    let rich = false;
    for (const blocks of replySections(content)) {
      const text = blocks.map(block => block.text || block.data.rows.flat().join(' ')).join('\n');
      const links = [...new Set([...text.matchAll(/https:\/\/[^\s<>()\[\]]+/gu)].map(match => match[0].replace(/[.,،؛]+$/u, '')).filter(safeLink))];
      const product = links.length === 1 ? previews.get(links[0]) : null;
      const heading = blocks.find(block => block.type === 'heading');
      const section = document.createElement('div');
      section.className = 'gpante-chat-segment';
      if (product || heading || blocks.some(block => block.type === 'facts')) { section.className += ' gpante-chat-segment--card';rich = true; }
      let subtitle;
      if (product || heading) {
        const header = document.createElement('div');header.className = 'gpante-chat-card-heading';
        if (product) {
          const image = document.createElement('img');
          image.className = 'gpante-chat-thumbnail';image.src = product.thumbnail;image.alt = '';
          image.width = image.height = 48;image.loading = 'lazy';image.decoding = 'async';image.referrerPolicy = 'no-referrer';
          image.addEventListener('error', () => { image.hidden = true; });header.append(image);
        }
        const copy = document.createElement('div');copy.className = 'gpante-chat-card-copy';
        const title = document.createElement('strong');title.className = 'gpante-chat-card-title';title.textContent = product?.title || heading.text;copy.append(title);
        subtitle = blocks.find(block => block.type === 'text' && !/https:\/\/|^\s*(?:[-*•]|[0-9۰-۹]+[.)])\s/u.test(block.text));
        if (subtitle) appendParagraph(copy, subtitle.text);
        header.append(copy);section.append(header);
      }
      for (const block of blocks) {
        if (block === subtitle || block.type === 'heading') continue;
        if (block.type === 'facts') appendFacts(section, block.data); else appendParagraph(section, block.text);
      }
      container.append(section);
    }
    return rich;
  }

  // The same rendering functions are exercised by the dependency-free Node checks.
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = { safeLink, safeThumbnail, appendContent, shortcutUrl };
    return;
  }

  const root = document.getElementById('gpante-support');
  if (!root || root.dataset.gpanteInitialized === 'true') return;
  root.dataset.gpanteInitialized = 'true';
  // Footer/page-builder transforms must not contain the fixed chat panel.
  if (document.body && root.parentElement !== document.body) document.body.appendChild(root);
  const find = selector => root.querySelector(selector);
  const panel = find('#gpante-support-panel');
  const launcher = find('[data-launcher]');
  const messages = find('[data-messages]');
  const scrollArea = find('[data-scroll]') || messages;
  const shortcuts = find('[data-shortcuts]');
  const status = find('[data-status]');
  const statusLabel = find('[data-status-label]');
  const statusText = find('[data-status-text]');
  const notice = find('[data-notice]');
  const activity = find('[data-activity]');
  const activityText = find('[data-activity-text]');
  const reconnect = find('[data-reconnect]');
  const input = find('[data-input]');
  const form = find('[data-form]');
  const send = find('[data-send]');
  const fresh = find('[data-new]');
  const confirmation = find('[data-confirm]');
  const clear = find('[data-clear]');
  const retry = find('[data-retry]');
  const older = find('[data-older]');
  const fallback = find('[data-fallback]');
  let busy = null;
  let historyRequest = null;
  let pendingSend = false;
  let requestHadFocus = false;
  let failed = null;
  let policy = null;
  let historyTimer = null;
  let welcomeItem = null;
  let sendAttempt = null;
  let loadedHistory = [];
  let historyCursor = null;
  let olderLoaded = false;
  let latestHistoryKey = null;
  let historyResetAt;
  let historyPolicyRevision;
  const appearanceTextLimits = {title:80,subtitle:160,launcher:60,welcome:1000,input_label:80,placeholder:250,send:40,clear:100};
  let appearanceTexts = {title:'دستیار پانته',welcome:'سلام! دنبال چه طرح یا فایلی هستید؟ موضوع، متریال، ضخامت و فرمت دلخواهتان را بنویسید تا دقیق‌تر راهنمایی‌تان کنم.'};

  function applyAppearance(value) {
    const colors = ['primary','on_primary','surface','text','messages','user','assistant','accent'];
    if (value?.version !== 1 || !value.texts || !value.colors
      || Object.entries(appearanceTextLimits).some(([key,limit]) => typeof value.texts[key] !== 'string'
        || !value.texts[key].trim() || [...value.texts[key]].length > limit)
      || colors.some(key => typeof value.colors[key] !== 'string' || !/^#[0-9a-f]{6}$/i.test(value.colors[key]))) return;
    appearanceTexts = Object.fromEntries(Object.keys(appearanceTextLimits).map(key => [key,value.texts[key]]));
    const fields = {title:'title',subtitle:'subtitle',launcher:'launcher-label',input_label:'input-label',send:'send-label',clear:'new'};
    for (const [key,selector] of Object.entries(fields)) {
      const element = find('[data-' + selector + ']');
      if (element) element.textContent = appearanceTexts[key];
    }
    input.setAttribute('placeholder', appearanceTexts.placeholder);
    send.setAttribute('aria-label', appearanceTexts.send);
    send.setAttribute('title', appearanceTexts.send);
    launcher.setAttribute('aria-label', appearanceTexts.launcher);
    for (const key of colors) root.style.setProperty('--gpante-' + key.replace('_','-'), value.colors[key]);
    for (const item of messages.children) {
      if (item.dataset.role === 'assistant') item.children[0].textContent = appearanceTexts.title;
    }
    if (welcomeItem && messages.contains(welcomeItem)) {
      welcomeItem.children[1].replaceChildren();
      appendContent(welcomeItem.children[1], appearanceTexts.welcome);
    }
    if (shortcuts) {
      shortcuts.replaceChildren();
      for (const link of Array.isArray(value.links) ? value.links.slice(0,4) : []) {
        const url = shortcutUrl(link?.url, typeof window !== 'undefined' ? window.location.href : undefined);
        if (!url || typeof link?.label !== 'string' || !link.label.trim() || [...link.label].length > 80) continue;
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.textContent = link.label;
        shortcuts.append(anchor);
      }
      shortcuts.hidden = !shortcuts.children.length;
    }
  }

  try { applyAppearance(JSON.parse(root.dataset.appearance || '{}')); } catch (_) { /* Keep server-rendered defaults. */ }
  // Read once per page, even behind a full-page cache. This never calls n8n or the model.
  if (root.dataset.appearanceEndpoint) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 6000);
    fetch(root.dataset.appearanceEndpoint, {
      method:'GET', mode:'same-origin', credentials:'omit', redirect:'error', cache:'no-store',
      headers:{Accept:'application/json'}, signal:controller.signal
    }).then(response => response.ok ? response.json() : null).then(applyAppearance)
      .catch(() => {}).finally(() => clearTimeout(timer));
  }

  function updateInput() {
    find('[data-count]').textContent = input.value.length.toLocaleString('fa-IR') + ' / ۴۰۰۰';
    input.disabled = pendingSend || Boolean(busy && busy !== 'history');
    send.disabled = input.disabled || !input.value.trim();
    if (fresh) fresh.disabled = Boolean(busy || pendingSend);
    if (clear) clear.disabled = Boolean(busy || pendingSend);
    retry.disabled = reconnect.disabled = Boolean(busy || pendingSend);
    if (older) older.disabled = Boolean(busy || pendingSend);
  }

  function setConnection(state) {
    if (typeof navigator !== 'undefined' && navigator.onLine === false) state = 'offline';
    const labels = {connecting:'Connecting',ready:'Online',offline:'Disconnected'};
    if (status.dataset.state !== state || statusLabel.textContent !== labels[state]) {
      status.dataset.state = state;
      statusLabel.textContent = labels[state];
      status.title = {connecting:'در حال بررسی ارتباط با سرویس چت',ready:'آخرین ارتباط با سرویس چت موفق بود',offline:'ارتباط با سرویس چت تأیید نشده است'}[state];
    }
  }

  function showNotice(text = '', error = false) {
    if (!text && typeof navigator !== 'undefined' && navigator.onLine === false) { offlineNotice(); return; }
    if (statusText.textContent !== text) statusText.textContent = text;
    notice.hidden = !text;
    root.dataset.error = error ? 'true' : 'false';
    if (!text) retry.hidden = reconnect.hidden = true;
    if (fallback) {
      const question = failed?.text || input.value.trim();
      fallback.hidden = !error || !question || !root.dataset.searchUrl;
      if (!fallback.hidden) {
        const url = new URL(root.dataset.searchUrl, typeof window !== 'undefined' ? window.location.href : 'https://gpante.com/');
        url.searchParams.set('s', question);
        const tooLong = url.href.length > 1800;
        if (tooLong) url.searchParams.set('s', '');
        fallback.textContent = tooLong ? 'جست‌وجوی سایت؛ پرسش را کوتاه‌تر وارد کنید' : 'جست‌وجوی همین پرسش در سایت';
        fallback.href = url.href;
      }
    }
  }

  function setActivity(text = '') {
    if (activityText.textContent !== text) activityText.textContent = text;
    activity.hidden = !text;
    if (text) scrollArea.scrollTop = scrollArea.scrollHeight;
  }

  function setBusy(action) {
    if (action) requestHadFocus = panel.contains(document.activeElement);
    busy = action;
    if (!action) setActivity();
    messages.setAttribute('aria-busy', String(Boolean(action)));
    updateInput();
    // Chrome moves focus to body when its active control is disabled or hidden.
    if (!action && requestHadFocus && !panel.hidden && document.activeElement === document.body) input.focus({ preventScroll: true });
  }

  function addMessage(role, text, scroll = true, expiresAt, products, requestId, feedback) {
    if (/^[a-f0-9]{32}$/.test(requestId || '')) {
      const existing = [...messages.children].find(item => item.dataset.requestId === requestId && item.dataset.role === role);
      if (existing) return existing;
    }
    const item = document.createElement('div');
    item.dataset.role = role;
    if (expiresAt) item.dataset.expiresAt = expiresAt;
    item.className = 'gpante-chat-message gpante-chat-message--' + role;
    const label = document.createElement('small');
    label.textContent = role === 'user' ? 'شما' : appearanceTexts.title;
    const body = document.createElement('div');
    if (role === 'assistant') {
      body.className = 'gpante-chat-reply';
      if (appendContent(body, text, products)) item.className += ' gpante-chat-message--rich';
    }
    else body.textContent = text;
    item.append(label, body);
    if (/^[a-f0-9]{32}$/.test(requestId || '')) {
      item.dataset.requestId = requestId;
      if (role === 'assistant') {
        const controls = document.createElement('div');
        controls.className = 'gpante-chat-feedback';
        controls.setAttribute('role', 'group');
        controls.setAttribute('aria-label', 'آیا این پاسخ مفید بود؟');
        for (const [value, caption] of [['helpful','مفید بود'],['unhelpful','مفید نبود']]) {
          const button = document.createElement('button');
          button.type = 'button';button.textContent = caption;
          button.setAttribute('aria-pressed', String(feedback === value));
          button.addEventListener('click', async () => {
            if (busy || pendingSend) return;
            setBusy('feedback');
            try {
              await api('feedback', null, {feedbackRequestId:requestId,feedbackValue:value});
              for (const child of controls.children) child.setAttribute('aria-pressed', String(child === button));
              for (const message of loadedHistory) if (message.requestId === requestId) message.feedback = value;
              showNotice('بازخورد شما ثبت شد.');
            } catch (_) { showNotice('بازخورد ثبت نشد؛ کمی بعد دوباره تلاش کنید.', true); }
            finally { setBusy(null); }
          });
          controls.append(button);
        }
        item.append(controls);
      }
    }
    messages.append(item);
    if (scroll) scrollArea.scrollTop = scrollArea.scrollHeight;
    return item;
  }

  function welcome() {
    welcomeItem = addMessage('assistant', appearanceTexts.welcome);
    welcomeItem.className += ' gpante-chat-message--welcome';
  }

  function validPolicy(value) {
    return value?.version === 2 && value.archiveDays === 30 && [3, 7, 15, 30].includes(value.userDays)
      && typeof value.allowClear === 'boolean' && Number.isSafeInteger(value.revision) && value.revision > 0;
  }

  function applyPolicy(value) {
    if (!validPolicy(value)) throw new Error('سیاست گفتگو دریافت نشد. لطفاً صفحه را تازه کنید.');
    if (historyPolicyRevision && historyPolicyRevision !== value.revision) {
      // Missed intermediate policies may have expired rows permanently, even if days returns to its old value.
      loadedHistory = [];historyCursor = null;olderLoaded = false;latestHistoryKey = null;
      for (const item of [...messages.children]) if (item.dataset.expiresAt) item.remove();
      if (older) older.hidden = true;
    }
    historyPolicyRevision = value.revision;
    policy = value;
    if (fresh) fresh.hidden = !value.allowClear;
    if (!value.allowClear && confirmation) confirmation.hidden = true;
  }

  function scheduleHistoryCheck() {
    clearTimeout(historyTimer);
    if (panel.hidden) return;
    let delay = policy ? 60000 : Infinity;
    for (const item of [...messages.children]) {
      const deadline = Date.parse(item.dataset.expiresAt || '');
      if (!Number.isFinite(deadline)) continue;
      if (deadline <= Date.now()) item.remove();
      else delay = Math.min(delay, deadline - Date.now());
    }
    if (!Number.isFinite(delay)) return;
    // Known expiry still applies when a failed refresh invalidates the server policy.
    historyTimer = setTimeout(() => {
      for (const item of [...messages.children]) {
        if (Date.parse(item.dataset.expiresAt || '') <= Date.now()) item.remove();
      }
      if (!panel.hidden && !busy && policy) loadHistory(true);
      else scheduleHistoryCheck();
    }, Math.max(1, Math.min(delay, 2147483647)));
  }

  function apiError(message, code, uncertain = false) {
    return Object.assign(new Error(message), {code, uncertain});
  }

  async function api(action, text, extra = {}) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 160000);
    try {
      const body = { action, policyVersion: policy?.version || 0, ...extra };
      if (action === 'sendMessage') body.chatInput = text;
      const response = await fetch(root.dataset.endpoint, {
        method: 'POST', mode: 'same-origin', credentials: 'same-origin', redirect: 'error', cache: 'no-store',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(body), signal: controller.signal
      });
      const data = await response.json();
      if (!response.ok || !data || data.error) {
        const reasons = ['rate_limit','session_busy','capacity','request_limit','monthly_budget','pricing_review','prior_request_failed','prior_request_expired','feedback_unavailable'];
        const code = reasons.includes(data?.error?.code) ? data.error.code
          : response.status === 429 ? 'request_limit' : response.status >= 400 && response.status < 500 ? 'request_rejected' : 'backend_unavailable';
        throw apiError(typeof data?.output === 'string' ? data.output.slice(0, 500) : 'دستیار در حال حاضر در دسترس نیست. لطفاً کمی بعد دوباره تلاش کنید.',
          code, action === 'sendMessage' && code === 'backend_unavailable');
      }
      if (!validPolicy(data.policy)) throw apiError('سیاست گفتگو دریافت نشد. لطفاً صفحه را تازه کنید.', 'invalid_response', action === 'sendMessage');
      applyPolicy(data.policy);
      if (action === 'sendMessage' && (typeof data.output !== 'string' || !data.output.trim() || data.output.length > 8000 || !Number.isFinite(Date.parse(data.expiresAt)))) throw apiError('پاسخ معتبری دریافت نشد.', 'invalid_response', true);
      if (action === 'loadPreviousSession' && (!Array.isArray(data.messages) || data.messages.length > 100 || data.messages.some(message =>
        !message || !['user', 'assistant'].includes(message.role) || typeof message.content !== 'string' || message.content.length > 8000 || !Number.isFinite(Date.parse(message.expiresAt))))) throw apiError('تاریخچه در دسترس نیست. لطفاً دوباره تلاش کنید.', 'invalid_response');
      if (action === 'resetSession' && data.ok !== true) throw apiError('پاک‌کردن تاریخچه انجام نشد. لطفاً دوباره تلاش کنید.', 'operation_failed');
      if (action === 'feedback' && data.ok !== true) throw apiError('بازخورد ثبت نشد.', 'operation_failed');
      if (action === 'loadPreviousSession' && (data.hasMore !== undefined && typeof data.hasMore !== 'boolean'
        || data.nextCursor != null && (typeof data.nextCursor !== 'string' || !/^[1-9][0-9]{0,17}$/.test(data.nextCursor))
        || data.hasMore === true && !data.nextCursor
        || data.historyResetAt != null && !Number.isFinite(Date.parse(data.historyResetAt)))) throw apiError('تاریخچه معتبر نیست.', 'invalid_response');
      setConnection('ready');
      return data;
    } catch (error) {
      if (error.name === 'AbortError') throw apiError('زمان دریافت پاسخ به پایان رسید.', 'timeout', action === 'sendMessage');
      if (['TypeError','SyntaxError'].includes(error.name)) throw apiError('پاسخی معتبر از سرویس چت دریافت نشد.', 'network', action === 'sendMessage');
      throw error;
    } finally {
      clearTimeout(timer);
    }
  }

  function renderFailure() {
    if (!failed) return;
    let text = failed.error.uncertain && failed.checked ? 'نتیجهٔ ارسال قبلی تأیید نشد.' : failed.error.message;
    if (failed.error.uncertain) text += failed.checked
      ? ' تاریخچه به‌روز شد؛ اگر پاسخ در پیام‌ها نیست، می‌توانید دوباره بفرستید. همان ارسال با شناسهٔ قبلی بررسی می‌شود.'
      : ' دریافت پاسخ تأیید نشد؛ ابتدا اتصال و تاریخچه را بررسی کنید. ممکن است پاسخ روی سرور ثبت شده باشد.';
    if (input.value.trim()) text += ' متن نوشته‌شده در کادر محفوظ است؛ نیازی به نوشتن دوبارهٔ آن نیست.';
    showNotice(text, true);
    reconnect.hidden = status.dataset.state === 'ready' && Boolean(policy) && (!failed.error.uncertain || failed.checked) && failed.action !== 'loadPreviousSession';
    retry.hidden = !reconnect.hidden || failed.action === 'loadPreviousSession'
      || ['monthly_budget','pricing_review'].includes(failed.error.code) || (failed.action === 'resetSession' && !policy?.allowClear);
    retry.textContent = failed.action === 'resetSession' ? 'تلاش دوباره برای پاک‌کردن' : 'تلاش دوباره';
  }

  function failure(error, action, text) {
    failed = {action, text, error, checked:false};
    if (['network','timeout','backend_unavailable','invalid_response'].includes(error.code)
      || (action === 'loadPreviousSession' && status.dataset.state !== 'ready')) setConnection('offline');
    renderFailure();
  }

  function loadHistory(quiet = false) {
    // Reuse the first request so a queued send keeps its signed session cookie.
    if (!historyRequest) historyRequest = readHistory(quiet).finally(() => { historyRequest = null; });
    return historyRequest;
  }

  function renderHistory(showWelcome = true) {
    messages.replaceChildren();
    for (const message of loadedHistory) addMessage(message.role, message.content, false, message.expiresAt, message.products, message.requestId, message.feedback);
    if (!loadedHistory.length && showWelcome) welcome();
    if (older) older.hidden = !historyCursor;
  }

  async function readHistory(quiet, cursor) {
    const previousFailure = failed;
    const previousRevision = historyPolicyRevision;
    setBusy('history');
    scheduleHistoryCheck();
    if (!quiet || status.dataset.state !== 'ready') setConnection('connecting');
    try {
      let data = await api('loadPreviousSession', null, cursor ? {historyCursor:cursor} : {});
      let reset = !Object.hasOwn(data, 'historyResetAt') || data.historyResetAt !== historyResetAt;
      if (cursor && (reset || previousRevision !== data.policy.revision)) {
        loadedHistory = [];historyCursor = null;olderLoaded = false;
        renderHistory(false);
        cursor = null;
        data = await api('loadPreviousSession');
        reset = !Object.hasOwn(data, 'historyResetAt') || data.historyResetAt !== historyResetAt;
      }
      if (reset) { loadedHistory = [];olderLoaded = false; }
      historyResetAt = data.historyResetAt;
      const key = message => message.role + ':' + (message.requestId || message.content + ':' + message.expiresAt);
      const pageKeys = new Set(data.messages.map(key));
      const overlap = loadedHistory.findIndex(message => pageKeys.has(key(message)));
      // A shared server-read boundary proves continuity; a local send alone can conceal a gap.
      const continuous = data.hasMore && overlap >= 0 && pageKeys.has(latestHistoryKey);
      const combined = new Map((cursor ? [...data.messages, ...loadedHistory]
        : [...(continuous ? loadedHistory.slice(0, overlap) : []), ...data.messages]).map(message => [key(message),message]));
      loadedHistory = [...combined.values()].filter(message => Date.parse(message.expiresAt) > Date.now());
      if (!cursor) latestHistoryKey = data.messages.length ? key(data.messages.at(-1)) : null;
      if (!cursor && !continuous) olderLoaded = false;
      if (cursor || !olderLoaded || reset) historyCursor = data.hasMore ? data.nextCursor : null;
      if (cursor) olderLoaded = true;
      const previousHeight = scrollArea.scrollHeight || 0, previousTop = scrollArea.scrollTop || 0;
      renderHistory(!data.messages.length);
      scrollArea.scrollTop = cursor ? previousTop + (scrollArea.scrollHeight || 0) - previousHeight : scrollArea.scrollHeight;
      if (previousFailure && failed === previousFailure && previousFailure.action !== 'loadPreviousSession'
        && (previousFailure.action !== 'resetSession' || policy.allowClear)) {
        previousFailure.checked = true;
        renderFailure();
      } else {
        failed = null;
        showNotice();
      }
      return true;
    } catch (error) {
      // A failed refresh must not erase already displayed messages or the unresolved action.
      policy = null;
      if (fresh) fresh.hidden = true;
      if (previousFailure && failed === previousFailure && previousFailure.action !== 'loadPreviousSession') {
        setConnection('offline');
        renderFailure();
      } else failure(error, 'loadPreviousSession');
      return false;
    } finally {
      setBusy(null);
      scheduleHistoryCheck();
      if (!panel.hidden && document.activeElement === panel) input.focus({ preventScroll: true });
    }
  }

  async function submitMessage() {
    const text = input.value.trim();
    if (pendingSend || (busy && busy !== 'history') || !text) return;
    if (text.length > 4000) {
      showNotice('لطفاً پرسش را با حداکثر ۴۰۰۰ نویسه بنویسید.', true);
      return;
    }
    if (failed?.error.uncertain && !failed.checked) {
      loadHistory(true);
      return;
    }
    if (busy === 'history' || !policy || status.dataset.state !== 'ready') {
      const hadFocus = panel.contains(document.activeElement);
      pendingSend = true;
      updateInput();
      const ready = loadHistory();
      setActivity('پیامتان آمادهٔ ارسال است؛ پس از تأیید ارتباط، یک‌بار ارسال می‌شود.');
      const loaded = await ready;
      pendingSend = false;
      updateInput();
      if (hadFocus && !panel.hidden && document.activeElement === document.body) input.focus({ preventScroll: true });
      if (!loaded) {
        failed = { ...failed, action: 'sendMessage', text };
        renderFailure();
        return;
      }
    }
    failed = null;
    showNotice();
    if (confirmation) confirmation.hidden = true;
    const item = addMessage('user', text);
    if (!sendAttempt || sendAttempt.text !== text) {
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      sendAttempt = {text,id:Array.from(bytes, value => value.toString(16).padStart(2,'0')).join('')};
    }
    input.value = '';
    setBusy('send');
    setActivity('در حال آماده‌کردن پاسخ…');
    try {
      const data = await api('sendMessage', text, {sendId:sendAttempt.id});
      item.dataset.expiresAt = data.expiresAt;
      if (data.requestId && [...messages.children].some(message => message !== item && message.dataset.role === 'user' && message.dataset.requestId === data.requestId)) item.remove();
      else if (data.requestId) item.dataset.requestId = data.requestId;
      addMessage('assistant', data.output, true, data.expiresAt, data.products, data.requestId, data.feedback);
      loadedHistory.push({role:'user',content:text,expiresAt:data.expiresAt,requestId:data.requestId},
        {role:'assistant',content:data.output,expiresAt:data.expiresAt,products:data.products,requestId:data.requestId,feedback:data.feedback});
      sendAttempt = null;
      failed = null;
      showNotice();
    } catch (error) {
      item.remove();
      input.value = text;
      failure(error, 'sendMessage', text);
      if (['prior_request_failed','prior_request_expired'].includes(error.code)) sendAttempt = null;
    } finally {
      setBusy(null);
      scheduleHistoryCheck();
      if (!panel.hidden && panel.contains(document.activeElement)) input.focus({ preventScroll: true });
    }
  }

  async function clearHistory() {
    if (busy || !policy?.allowClear) return;
    setBusy('reset');
    if (confirmation) confirmation.hidden = true;
    showNotice();
    setActivity('در حال پاک‌کردن گفتگو…');
    try {
      await api('resetSession');
      messages.replaceChildren();
      loadedHistory = [];historyCursor = null;olderLoaded = false;latestHistoryKey = null;sendAttempt = null;
      if (older) older.hidden = true;
      welcome();
      input.value = '';
      failed = null;
      showNotice('تاریخچهٔ قابل مشاهدهٔ شما پاک شد. آرشیو مدیریتی تا پایان مهلت ۳۰روزه باقی می‌ماند.');
    } catch (error) {
      failure(error, 'resetSession');
    } finally {
      setBusy(null);
      scheduleHistoryCheck();
      if (!panel.hidden && panel.contains(document.activeElement)) input.focus({ preventScroll: true });
    }
  }

  const browserHistory = typeof window !== 'undefined' ? window.history : null;
  const storedToken = browserHistory?.state?.gpanteSupportChat;
  const historyToken = typeof storedToken === 'string' && storedToken.startsWith('gpante-')
    ? storedToken : 'gpante-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
  let historyClosing = false;
  let reopenRequested = false;

  function closePanel(restoreFocus = true, releaseHistory = true) {
    if (panel.hidden) return;
    panel.hidden = true;
    clearTimeout(historyTimer);
    if (confirmation) confirmation.hidden = true;
    launcher.setAttribute('aria-expanded', 'false');
    if (restoreFocus) launcher.focus({ preventScroll: true });
    if (releaseHistory && browserHistory?.state?.gpanteSupportChat === historyToken) {
      historyClosing = true;
      browserHistory.back();
    }
  }

  function openPanel(pushHistory = true) {
    if (historyClosing) { reopenRequested = true; return; }
    if (!panel.hidden) return;
    if (pushHistory && browserHistory && browserHistory.state?.gpanteSupportChat !== historyToken) {
      try { browserHistory.pushState({ ...browserHistory.state, gpanteSupportChat: historyToken }, ''); }
      catch (_) { /* The panel remains usable when an embed disallows history writes. */ }
    }
    panel.hidden = false;
    launcher.setAttribute('aria-expanded', 'true');
    panel.focus({ preventScroll: true });
    if (!busy) loadHistory(true);
    if (!input.disabled) input.focus({ preventScroll: true });
  }

  launcher.addEventListener('click', () => panel.hidden ? openPanel() : closePanel());
  find('[data-close]').addEventListener('click', () => closePanel());
  document.addEventListener('click', event => {
    if (!panel.hidden && !root.contains(event.target)) closePanel(false);
  });
  if (typeof window !== 'undefined') window.addEventListener('popstate', () => {
    historyClosing = false;
    if (browserHistory?.state?.gpanteSupportChat === historyToken) openPanel(false);
    else closePanel(true, false);
    if (reopenRequested) { reopenRequested = false; openPanel(); }
  });
  root.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !panel.hidden) {
      event.preventDefault();
      if (confirmation && !confirmation.hidden) {
        if (confirmation) confirmation.hidden = true;
        if (fresh) fresh.focus();
      } else closePanel();
    }
  });
  form.addEventListener('submit', event => { event.preventDefault(); submitMessage(); });
  input.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      submitMessage();
    }
  });
  input.addEventListener('input', () => {
    updateInput();
    if (failed?.action === 'sendMessage' && !failed.error.uncertain) {
      failed = null;
      showNotice();
      if (status.dataset.state === 'offline') offlineNotice();
    }
  });
  if (fresh && confirmation && clear) fresh.addEventListener('click', () => { if (!policy?.allowClear) return; confirmation.hidden = false; clear.focus(); });
  const cancel = find('[data-cancel]');
  if (cancel && confirmation && fresh) cancel.addEventListener('click', () => { confirmation.hidden = true; fresh.focus(); });
  if (clear) clear.addEventListener('click', clearHistory);
  retry.addEventListener('click', () => {
    if (!failed || busy) return;
    if (failed.action === 'sendMessage') {
      if (!input.value.trim()) input.value = failed.text;
      submitMessage();
    } else if (failed.action === 'resetSession') clearHistory();
    else loadHistory();
  });
  if (typeof window !== 'undefined') window.addEventListener('focus', () => { if (!panel.hidden && !busy) loadHistory(true); });
  reconnect.addEventListener('click', () => { if (!busy && !pendingSend) loadHistory(true); });
  if (older) older.addEventListener('click', () => {
    if (!busy && !pendingSend && historyCursor && !historyRequest) historyRequest = readHistory(true, historyCursor).finally(() => { historyRequest = null; });
  });
  function offlineNotice() {
    setConnection('offline');
    showNotice(busy === 'send' ? 'ارتباط قطع شد؛ دریافت نتیجهٔ پیام هنوز تأیید نشده است. ابتدا منتظر نتیجهٔ درخواست بمانید.'
      : 'ارتباط برقرار نیست. اتصال اینترنت را بررسی کنید؛ متن نوشته‌شده در کادر حفظ می‌شود.', true);
    retry.hidden = true;
    reconnect.hidden = false;
  }
  if (typeof window !== 'undefined') {
    window.addEventListener('offline', offlineNotice);
    window.addEventListener('online', () => {
      if (panel.hidden) return;
      if (!busy) loadHistory(true);
      else setConnection('connecting');
    });
  }
  setConnection('connecting');
  setActivity();
  showNotice();
  updateInput();
  // Restore an open history entry on reload/forward rather than leaving a dead Back step.
  if (browserHistory?.state?.gpanteSupportChat === historyToken) openPanel(false);
}());
</script>
